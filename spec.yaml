# Machine-readable spec. tools/verify.py and tools/measure.py read only this file.
# spec.md says the same in words. Change these two files for a new chip; the harness stays.

name: two-channel heated MZI lattice demux
pdk: siphopdk                       # tools/pdks/<pdk>.py

layout:
  max_size: [440.0, 480.0]          # um, bounding box of the whole chip (x, y)
  optical_ports: [IN1, IN2, OUT1, OUT2]   # top-level ports; fiber side of the grating couplers
  heater_terminals: true            # every heater wired to two top-level terminals H<k>P / H<k>N

simulation:
  band: [1.300, 1.320]              # um
  points: 401
  paths: [[IN1, OUT1], [IN1, OUT2]] # (input, output) port pairs that the station measures

heaters:
  max_dT: 75.0                      # K, highest rise the station accepts for one heater
  nominal_total_dT_max: 20.0        # K, sum over heaters on the nominal die (bias belongs in the layout)

metrics:                            # each runs on the nominal die and on every virtual die
  - name: channel_A
    path: [IN1, OUT1]
    type: channel
    args: {center: 1.310, pass_halfwidth: 0.0015, stop_offsets: [0.005], stop_halfwidth: 0.0010}
    nominal: {ripple_db: {max: 1.0}, insertion_loss_db: {max: 4.5}, isolation_db: {min: 15.0}, center_error_nm: {abs_max: 0.5}}
    die:     {ripple_db: {max: 1.5}, insertion_loss_db: {max: 5.0}, isolation_db: {min: 10.0}, center_error_nm: {abs_max: 0.5}}
  - name: channel_B
    path: [IN1, OUT2]
    type: channel
    args: {center: 1.315, pass_halfwidth: 0.0015, stop_offsets: [-0.005], stop_halfwidth: 0.0010}
    nominal: {ripple_db: {max: 1.0}, insertion_loss_db: {max: 4.5}, isolation_db: {min: 15.0}, center_error_nm: {abs_max: 0.5}}
    die:     {ripple_db: {max: 1.5}, insertion_loss_db: {max: 5.0}, isolation_db: {min: 10.0}, center_error_nm: {abs_max: 0.5}}

variation:                          # virtual dies (tools/measure.py). Sigmas, one standard deviation.
  dies: 8                           # blind dies in the final check (new random seeds every run)
  pass_fraction: 0.75               # share of blind dies that must meet every 'die' target after calibrate()
  training_dies: 20                 # seeds 0..19: the team may use these freely
  n_eff:
    global: 0.003                   # whole-die offset (film thickness, mean width)
    gradient_per_um: 5.0e-6         # linear slope across the die, x and y
    local: 2.0e-4                   # independent per waveguide piece
  coupler_length_scale:             # multiplies the full-transfer length of every coupler (gap variation)
    global: 0.03
    local: 0.01

measurement:
  budget_per_die: 60                # station.measure() calls that calibrate() may use on one die
  noise_db: 0.05
  floor_db: -50.0
